<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Feed Sign Up</title>

    <style>
        * {
            margin: 0;
        }

        body {
            background: rgb(120, 96, 64);
            text-align: center;
        }

        #formContainer {
            background-color: white;
            border: solid 10px darkblue;
            border-radius: 10%;
            width: 500px;
            justify-self: center;
        }

        #hero img {
            object-fit: cover;
            width: 100%;
            margin-top: -85px;
            float:left;
            border-top-right-radius: 10%;
            border-top-left-radius: 10%;
        }

        #myForm {
            display: grid;
            grid-template-columns: 1fr 1fr;
            padding: 30px;
            height: 200px;
        }
        section {
            grid-column: 1/3;
            justify-self: center;
        }

        #bookCovers {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
        }
        .scriptures {
            width: 6rem;
        }
        #left-scripture {
            border-bottom-left-radius: 40%;
        }
        #right-scripture {
            border-bottom-right-radius: 40%;
        }
        h1, h2 {
            color: white;
            text-shadow: black 5px;
        }

    </style>




</head>

<body>
    <div id="formContainer">
        <div id="hero">
            <button type="button" id="closeBtn">X</button>
            <h1>Daily Feed</h1>
            <h2>Scripture a Day</h2>
            <img src="images/jesus_feeds_5000.jpeg" id="heroImage">
        </div>
        <h3>Sign Up for Daily Scripture Feed</h3>
        <form id="myForm">
            <label for="username">User Name:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label>Gender:</label>
            <div>
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female" required>
                <label for="female">Female</label>
            </div>

            <section>
                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">Subscribe to newsletter</label>
            </section>

            <section>
                <input type="checkbox" id="conditions" name="conditions" required>
                <label for="conditions">I acknowledge the terms and conditions</label>
            </section>

            <section>
                <button type="submit">Submit</button>
            </section>
        </form>
        <div id="bookCovers">
            <img src="images/book_of_mormon.webp" class="scriptures" id="left-scripture">
            <img src="images/doctrine_and_covenants.webp" class="scriptures">
            <img src="images/new_testament.webp" class="scriptures">
            <img src="images/old_testament.webp" class="scriptures">
            <img src="images/pearl_of_great_price.webp" class="scriptures" id="right-scripture">
        </div>
    </div>

    <div id="output"></div>

    <script>
        // Here is some Javascript to start looking forward to wdd131
        document.getElementById("closeBtn").addEventListener("click", function () {
            document.getElementById("formContainer").style.display = "none";
         });
        const form = document.getElementById('myForm');
        const output = document.getElementById('output');

        form.addEventListener('submit', function (event) {
            event.preventDefault(); // Stop form from actually submitting

            const formData = new FormData(form);
            const entries = [];

            for (const [key, value] of formData.entries()) {
                if (key == "password") {
                    entries.push(`<strong>${key}</strong>: ${value} (you should probably encrypt the password)`);
                } else {
                    entries.push(`<strong>${key}</strong>: ${value}`);
                }
            }

            output.innerHTML = `
            <br>  
            <h3>Here is the data that would be sent to the server:</h3>
            <ul>
                ${entries.map(item => `<li>${item}</li>`).join('')}
            </ul>
            `;
                });
    </script>

</body>

</html>
